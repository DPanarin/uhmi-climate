<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/inter/inter-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/inter/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Кліматичні зміни в Україні</title>
    <style>
      /* Static header painted before the app's JS arrives; Vue replaces #app's content on mount. */
      .shell {
        position: fixed;
        inset: 0 0 auto 0;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 60px;
        padding: 0 16px;
        border-bottom: 1px solid rgba(31, 42, 51, 0.12);
        background: #fff;
        color: #1f2a33;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .shell h1 {
        margin: 0;
        font-size: clamp(15px, 1.8vw, 18px);
        font-weight: 650;
      }
      @media (max-width: 599px) {
        .shell {
          height: 48px;
          padding: 0 12px;
        }
        .shell img {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="shell">
        <img src="/favicon.svg" alt="" width="28" height="28" />
        <h1>Кліматичні зміни в Україні</h1>
      </header>
      <script>
        if (/[?&]lang=en\b/.test(location.search))
          document.querySelector('.shell h1').textContent = 'Climate change in Ukraine'
      </script>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
